# ── AECP Local Development Stack ─────────────────────────────────────────────
#
# Services:
#   zookeeper     — Kafka coordination
#   kafka         — Message broker
#   kafka-init    — One-shot container that pre-creates AECP topics
#   control-plane — AECP Control Plane REST API (port 8080)
#
# Usage:
#   docker-compose up -d
#   curl http://localhost:8080/health
#
# Consume events (run inside the kafka container using the internal listener):
#   docker exec -it aecp-kafka kafka-console-consumer \
#     --bootstrap-server kafka:29092 \
#     --topic aecp.events --from-beginning --property print.key=true

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: aecp-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: aecp-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Two listeners:
      #   PLAINTEXT        — external (host machine) on port 9092
      #   PLAINTEXT_INTERNAL — internal (docker network) on port 29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:29092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: aecp-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        kafka-topics --bootstrap-server kafka:29092 \
          --create --if-not-exists \
          --topic aecp.events \
          --partitions 4 \
          --replication-factor 1

        kafka-topics --bootstrap-server kafka:29092 \
          --create --if-not-exists \
          --topic aecp.events.dlq \
          --partitions 1 \
          --replication-factor 1

        echo "Topics ready:"
        kafka-topics --bootstrap-server kafka:29092 --list
    restart: "no"

  control-plane:
    build:
      context: ./control-plane
      dockerfile: Dockerfile
    container_name: aecp-control-plane
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./control-plane/policies:/app/policies:ro
    environment:
      AECP_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  default:
    name: aecp-network
