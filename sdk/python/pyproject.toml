[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aecp-sdk"
version = "1.0.0"
description = "AECP Python SDK — observable, governed, and secure agent execution"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
# Install confluent-kafka separately to keep the core SDK lightweight.
# Usage: pip install 'aecp-sdk[kafka]'
kafka = ["confluent-kafka>=2.3.0"]

dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aecp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
